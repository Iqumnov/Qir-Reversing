[workspace]
members = [
    "core",
    "cli",
    "mcp",
    "plugins/rizin",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Matvei Igumnov <iqumnov@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/Iqumnov/Qir-Reversing"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

