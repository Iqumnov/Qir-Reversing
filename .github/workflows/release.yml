name: Release Multi-Platform Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64 & WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Linux Binaries & WebAssembly
        run: |
          cargo build --release --workspace
          cargo build --release --target wasm32-unknown-unknown --manifest-path core/Cargo.toml
          mkdir -p dist/qir-rev-linux-x86_64
          cp target/release/qir-rev target/release/qir-rev-mcp target/release/librz_qir.so README.md LICENSE dist/qir-rev-linux-x86_64/
          cp -r qir_plugin dist/qir-rev-linux-x86_64/
          rm -rf dist/qir-rev-linux-x86_64/qir_plugin/__pycache__
          tar -czvf qir-rev-linux-x86_64.tar.gz -C dist qir-rev-linux-x86_64
          cp target/wasm32-unknown-unknown/release/qir_core.wasm ./

      - name: Stage Linux & Wasm Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            qir-rev-linux-x86_64.tar.gz
            qir_core.wasm

  build-windows:
    name: Build Windows (x86_64 CLI & MCP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Binaries
        shell: bash
        run: |
          cargo build --release --workspace
          mkdir -p dist/qir-rev-windows-x86_64
          cp target/release/qir-rev.exe target/release/qir-rev-mcp.exe README.md LICENSE dist/qir-rev-windows-x86_64/
          if [ -f target/release/rz_qir.dll ]; then
            cp target/release/rz_qir.dll dist/qir-rev-windows-x86_64/
          fi
          cp -r qir_plugin dist/qir-rev-windows-x86_64/
          rm -rf dist/qir-rev-windows-x86_64/qir_plugin/__pycache__
          7z a qir-rev-windows-x86_64.zip ./dist/qir-rev-windows-x86_64/*

      - name: Stage Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: qir-rev-windows-x86_64.zip

  build-macos:
    name: Build macOS (ARM64 & x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build macOS Binaries
        run: |
          cargo build --release --target aarch64-apple-darwin --workspace
          cargo build --release --target x86_64-apple-darwin --workspace
          mkdir -p dist-arm64 dist-x86_64
          cp target/aarch64-apple-darwin/release/qir-rev target/aarch64-apple-darwin/release/qir-rev-mcp README.md LICENSE dist-arm64/
          if [ -f target/aarch64-apple-darwin/release/librz_qir.dylib ]; then
            cp target/aarch64-apple-darwin/release/librz_qir.dylib dist-arm64/
          fi
          cp -r qir_plugin dist-arm64/
          rm -rf dist-arm64/qir_plugin/__pycache__
          cp target/x86_64-apple-darwin/release/qir-rev target/x86_64-apple-darwin/release/qir-rev-mcp README.md LICENSE dist-x86_64/
          if [ -f target/x86_64-apple-darwin/release/librz_qir.dylib ]; then
            cp target/x86_64-apple-darwin/release/librz_qir.dylib dist-x86_64/
          fi
          cp -r qir_plugin dist-x86_64/
          rm -rf dist-x86_64/qir_plugin/__pycache__
          tar -czvf qir-rev-macos-arm64.tar.gz -C dist-arm64 .
          tar -czvf qir-rev-macos-x86_64.tar.gz -C dist-x86_64 .

      - name: Stage macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            qir-rev-macos-arm64.tar.gz
            qir-rev-macos-x86_64.tar.gz

  publish:
    name: Generate SHA-256 Checksums & Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum * > ../SHA256SUMS.txt
          cd ..
          mv SHA256SUMS.txt release-assets/
          cat release-assets/SHA256SUMS.txt

      - name: Publish Release & Checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
