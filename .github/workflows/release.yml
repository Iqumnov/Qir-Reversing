name: Release Multi-Platform Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64 & WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Linux Binaries & WebAssembly
        run: |
          cargo build --release --workspace
          cargo build --release --target wasm32-unknown-unknown --manifest-path core/Cargo.toml
          mkdir -p dist/qir-linux-x86_64
          cp target/release/qir target/release/qir-mcp target/release/librz_qir.so README.md LICENSE dist/qir-linux-x86_64/
          tar -czvf qir-linux-x86_64.tar.gz -C dist qir-linux-x86_64
          cp target/wasm32-unknown-unknown/release/qir_core.wasm ./

      - name: Upload Linux & Wasm Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          files: |
            qir-linux-x86_64.tar.gz
            qir_core.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows (x86_64 CLI & MCP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Binaries
        shell: bash
        run: |
          cargo build --release --workspace
          mkdir -p dist/qir-windows-x86_64
          cp target/release/qir.exe target/release/qir-mcp.exe README.md LICENSE dist/qir-windows-x86_64/
          if [ -f target/release/rz_qir.dll ]; then
            cp target/release/rz_qir.dll dist/qir-windows-x86_64/
          fi
          7z a qir-windows-x86_64.zip ./dist/qir-windows-x86_64/*

      - name: Upload Windows Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          files: |
            qir-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS (Universal Binaries)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build macOS Binaries
        run: |
          cargo build --release --target aarch64-apple-darwin --workspace
          cargo build --release --target x86_64-apple-darwin --workspace
          mkdir -p dist-arm64 dist-x86_64
          cp target/aarch64-apple-darwin/release/qir target/aarch64-apple-darwin/release/qir-mcp README.md LICENSE dist-arm64/
          cp target/x86_64-apple-darwin/release/qir target/x86_64-apple-darwin/release/qir-mcp README.md LICENSE dist-x86_64/
          tar -czvf qir-macos-arm64.tar.gz -C dist-arm64 .
          tar -czvf qir-macos-x86_64.tar.gz -C dist-x86_64 .

      - name: Upload macOS Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          files: |
            qir-macos-arm64.tar.gz
            qir-macos-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
