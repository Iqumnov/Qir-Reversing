name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    name: Rust Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --workspace --all-features

      - name: Build release workspace
        run: cargo build --release --workspace

      - name: Compile C probe module (-Wall -Wextra)
        run: |
          if [ -d bin/include/librz ] || pkg-config --exists rz_asm 2>/dev/null; then
            make -C plugins/dummy clean && make -C plugins/dummy
          else
            echo "[*] Rizin development headers (bin/include/librz or pkg-config rz_asm) not present; skipping C probe compile."
          fi

      - name: Build WebAssembly core target
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path core/Cargo.toml

      - name: Upload built WebAssembly binary
        uses: actions/upload-artifact@v4
        with:
          name: qir-core-wasm
          path: target/wasm32-unknown-unknown/release/qir_core.wasm

  python:
    name: Python Suite Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

  lean:
    name: Lean 4 Formal Proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Lean 4 formal proofs
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs

  web:
    name: WebAssembly & Edge Tests
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download built WebAssembly binary
        uses: actions/download-artifact@v4
        with:
          name: qir-core-wasm
          path: web/wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Web test suite
        run: node web/test_suite.js

