[package]
name = "qir-mcp"
description = "Model Context Protocol (MCP) server for Quantum Intermediate Representation (QIR) reverse engineering"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qir-rev-mcp"
path = "src/main.rs"

[dependencies]
qir-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }

