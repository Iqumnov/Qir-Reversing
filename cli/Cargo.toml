[package]
name = "qir-cli"
description = "Command-line tool for LLVM Quantum Intermediate Representation (QIR) reverse engineering"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qir"
path = "src/main.rs"

[dependencies]
qir-core = { path = "../core" }
clap = { version = "4.4", features = ["derive"] }
colored = "3.1"
serde_json = "1.0"

