name = "qir-reversing"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Static Assets (Workers Static Assets with explicit ASSETS binding)
[assets]
directory = "."
binding = "ASSETS"

# Observability
[observability]
enabled = true

# For Cloudflare Pages deployment via Wrangler CLI:
# npx wrangler pages deploy . --project-name=qir-reversing

